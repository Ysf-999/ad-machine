<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* Placeholders: replace all three with the film's own palette and display face. */
      :root {
        --ground: #000;
        --ink: #ffffff;
        --font-display: sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: var(--font-display);
      }
      #title {
        color: var(--ink);
        font-size: 72px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="3"
      data-width="1080"
      data-height="1920"
    >
      <div class="clip" data-start="0" data-duration="3" data-track-index="0" style="text-align:center;font-family:Helvetica Neue,Arial,sans-serif;font-weight:800;text-shadow:0 6px 24px rgba(0,0,0,.6)">
  <div id="l1" style="color:#fff;font-size:88px">The pet supplies industry</div>
  <div id="kw" style="font-size:150px;color:#7CF0A0;text-shadow:0 0 24px #2fe07a,0 0 60px #1fbf5f"><span class="ch">t</span><span class="ch">r</span><span class="ch">i</span><span class="ch">c</span><span class="ch">k</span><span class="ch">i</span><span class="ch">n</span><span class="ch">g</span><span class="ch">&nbsp;</span><span class="ch">y</span><span class="ch">o</span><span class="ch">u</span></div>
</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.from("#l1",{opacity:0,y:30,duration:.25,ease:"power3.out"},0.1); tl.from("#kw .ch",{opacity:0,duration:.01,stagger:.06},0.5); // tl.fromTo("#title", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" }, 0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
