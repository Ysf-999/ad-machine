{
  "name": "creative-scorecard",
  "description": "Scores DTC ad copy and creative concepts for launch quality, scale potential, and strategic sharpness.",
  "block_heading_regex": "^(## Ad\\s+\\d+\\b.*|### Variation\\s+\\d+\\b.*|## UGC Video Script(?:\\s+\\d+)?\\b.*)$",
  "grade_thresholds": {
    "scale_candidate": 85,
    "testable": 70,
    "needs_sharpening": 55
  },
  "dimensions": [
    {
      "name": "Signal Strength",
      "weight": 15,
      "description": "The concept is grounded in a real buyer trigger, market hatred, VOC, failed alternative, review pattern, or current belief."
    },
    {
      "name": "Pressure Intensity",
      "weight": 15,
      "description": "The copy makes the cost of inaction feel immediate, concrete, and emotionally real without becoming fake."
    },
    {
      "name": "Belief Shift Clarity",
      "weight": 15,
      "description": "The ad moves one clean belief from current belief to new buying belief."
    },
    {
      "name": "Mechanism Believability",
      "weight": 15,
      "description": "The product's reason-why is specific, credible, and different from failed alternatives."
    },
    {
      "name": "Proof Density",
      "weight": 10,
      "description": "The ad includes proof, specificity, guarantee, authority, demonstration, testimonial logic, or reason-why support."
    },
    {
      "name": "Creative Visualizability",
      "weight": 10,
      "description": "The concept can become a clear native static, UGC shot, image prompt, or scalable visual format."
    },
    {
      "name": "Scale Potential",
      "weight": 10,
      "description": "The angle can be expanded horizontally into hooks, formats, archetypes, and creative variants."
    },
    {
      "name": "Reference Application",
      "weight": 10,
      "description": "The output shows which strategic references, control-library patterns, and market signals shaped the copy."
    }
  ],
